<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стакан с водой</title>
<style>
:root{--fg:#eaf6f8;--mut:#7fa0a8;--card:rgba(20,45,60,.75);--acc:#ff2d62;--teal:#5af0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0a1a24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#0c4a3e 0%,#0a2a3a 45%,#1a1040 100%);display:flex;flex-direction:column;align-items:center;padding:12px;user-select:none}
.w{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.cv{position:relative}
#cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;color:#fff;text-shadow:0 0 24px #5af0e6;pointer-events:none}
canvas{width:100%;height:auto;display:block;touch-action:none}
#time{font-size:52px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
#sub{font-size:12px;text-align:center;color:var(--mut);margin-top:-8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:8px;text-align:center}
.stat span{display:block;font-size:11px;color:var(--mut)}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:600;width:100%}
button:active{opacity:.8}
button.sec{background:rgba(255,255,255,.12);font-size:15px;padding:12px}
details{background:var(--card);border-radius:12px;padding:12px}
summary{font-size:14px;color:var(--mut)}
.set{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.lab{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--teal);height:32px;margin:0}
select{width:100%;padding:10px;border-radius:10px;font-size:15px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mut)}
#st{font-size:12px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="w">
  <div class="cv"><canvas id="c1" width="720" height="600"></canvas><div id="cdn"></div></div>
  <div id="time">00:00.00</div>
  <div id="sub">время без пролива</div>
  <div class="stats">
    <div class="stat"><span>Сейчас</span><b id="cur">0.00</b></div>
    <div class="stat"><span>Макс.</span><b id="mx">0.00</b></div>
    <div class="stat"><span>Пролито</span><b id="n">0</b></div>
  </div>
  <button id="go">Старт</button>
  <button class="sec" id="cal">По центру (калибровка)</button>
  <details>
    <summary>Настройки</summary>
    <div class="set">
      <div><div class="lab"><span>Чувствительность</span><span id="sv">1.0</span></div>
      <input id="s" type="range" min="0.2" max="3" step="0.1" value="1"></div>
      <div><div class="lab" style="margin-bottom:6px"><span>Положение телефона</span></div>
      <select id="m"><option value="z">Стоит вертикально (экран к тебе)</option><option value="y">Лежит горизонтально</option></select></div>
      <label class="chk"><input id="i1" type="checkbox">Инвертировать лево/право</label>
      <label class="chk"><input id="i2" type="checkbox">Инвертировать вперёд/назад</label>
      <button class="sec" id="rst">Сбросить счётчик</button>
    </div>
  </details>
  <div id="st">Нажми «Старт», чтобы включить датчик</div>
  <div id="dbg" style="font-size:12px;text-align:center;color:var(--mut)"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const c1=$('c1'),g1=c1.getContext('2d');
let ax=0,ay=0,az=0,offx=0,offy=0,offz=0,have=false,sens=1,spills=0,t0=0,fakeX=0,fakeL=0;
let sensorOn=false,running=false,ts=0,mx=0;
const A={a:0,v:0},B={a:0,v:0};
$('s').oninput=e=>{sens=+e.target.value;$('sv').textContent=sens.toFixed(1)};
$('cal').onclick=()=>{offx=ax;offy=ay;offz=az;A.a=A.v=B.a=B.v=0};
$('rst').onclick=()=>{spills=0;$('n').textContent=0};
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null)return;
  have=true;ax=ax*.6+a.x*.4;ay=ay*.6+(a.y||0)*.4;az=az*.6+(a.z||0)*.4;
  $('st').textContent='Датчик работает: x='+ax.toFixed(1)+' y='+ay.toFixed(1)+' z='+az.toFixed(1);
}
async function enableSensor(){
  if(sensorOn)return;sensorOn=true;
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      if(await DeviceMotionEvent.requestPermission()!=='granted'){$('st').textContent='Доступ к датчику запрещён';return}
    }
  }catch(err){}
  addEventListener('devicemotion',onMotion);
  try{if(window.Accelerometer){const sn=new Accelerometer({frequency:30});sn.addEventListener('reading',()=>onMotion({accelerationIncludingGravity:{x:sn.x,y:sn.y,z:sn.z}}));sn.addEventListener('error',e=>{$('dbg').textContent='Accelerometer: '+e.error.name});sn.start()}}catch(err){$('dbg').textContent='Accelerometer: '+err.name}
  $('st').textContent='Жду данные датчика…';
  setTimeout(()=>{offx=ax;offy=ay;offz=az},700);
  setTimeout(()=>{if(!have)$('st').textContent='Датчик не отвечает. Открой страницу напрямую по https-ссылке, а не внутри другого приложения. Для теста води пальцем по стакану.'},1800);
}
function fmt(s){const m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,'0')+':'+r.toFixed(2).padStart(5,'0')}
function begin(){running=true;ts=performance.now();mx=0;A.a=A.v=B.a=B.v=0;$('go').textContent='Стоп';$('sub').textContent='время без пролива'}
function finish(spilled){running=false;$('go').textContent='Старт';if(spilled){spills++;$('n').textContent=spills;$('sub').textContent='пролилось! результат сохранён'}}
let cdOn=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function jaVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith('ja'));
  return vs.find(v=>/female|kyoko|nanami|haruka|ayumi|o-ren|google|jac|jab/i.test(v.name))||vs[0];
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{};speechSynthesis.getVoices()}
function speak(t){
  try{
    const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';
    const v=jaVoice();if(v)u.voice=v;
    u.pitch=1.3;u.rate=1;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function endCd(){cdOn=false;$('cdn').textContent='';$('go').textContent='Старт'}
$('go').onclick=async()=>{
  if(running){finish(false);return}
  if(cdOn){endCd();return}
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  cdOn=true;$('go').textContent='Отмена';
  await enableSensor();
  if(!cdOn)return;
  for(const [txt,say] of [['3','さん'],['2','に'],['1','いち'],['СТАРТ','スタート']]){
    $('cdn').textContent=txt;if(txt==='СТАРТ')$('cdn').style.fontSize='64px';else $('cdn').style.fontSize='96px';
    speak(say);
    await sleep(1000);
    if(!cdOn)return;
  }
  endCd();begin();
};
let d=false;
c1.addEventListener('pointerdown',()=>d=true);
addEventListener('pointerup',()=>{d=false;fakeX=0;fakeL=0});
c1.addEventListener('pointermove',e=>{if(!d||have)return;const r=c1.getBoundingClientRect();fakeX=((e.clientX-r.left)/r.width-.5)*20;fakeL=-((e.clientY-r.top)/r.height-.5)*20});
function step(s,target,dt){
  const k=60,c=3.2;
  s.v+=(k*(Math.max(-1.2,Math.min(1.2,target))-s.a)-c*s.v)*dt;
  s.a+=s.v*dt;
}
function body(g,st,t,tw,h,lvl,c0,c1){
  const rip=Math.min(12,Math.abs(st.v)*2.5),tn=Math.tan(st.a);
  g.beginPath();g.moveTo(-tw-40,lvl-tn*(tw+40));
  for(let x=-tw-40;x<=tw+40;x+=10)g.lineTo(x,lvl+tn*x+Math.sin(x*.05+t/150)*rip);
  g.lineTo(tw+40,h*2);g.lineTo(-tw-40,h*2);g.closePath();
  const gr=g.createLinearGradient(0,-h*.4,0,h);
  gr.addColorStop(0,c0);gr.addColorStop(1,c1);
  g.fillStyle=gr;g.fill();
  g.lineWidth=4;g.strokeStyle='rgba(255,255,255,.45)';
  g.beginPath();for(let x=-tw-40;x<=tw+40;x+=10){const y=lvl+tn*x+Math.sin(x*.05+t/150)*rip;x===-tw-40?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
  return Math.min(lvl-tn*tw,lvl+tn*tw)<-h;
}
function draw(g,cv,sb,sa,t,tw,bw,h){
  g.clearRect(0,0,cv.width,cv.height);
  g.save();g.translate(cv.width/2,cv.height/2);
  const path=()=>{g.beginPath();g.moveTo(-tw,-h);g.lineTo(tw,-h);g.lineTo(bw,h);g.quadraticCurveTo(0,h+h*.1,-bw,h);g.closePath()};
  path();g.fillStyle='rgba(150,230,240,.07)';g.fill();
  g.save();path();g.clip();
  const m=Math.min(1,Math.max(Math.abs(sa.a),Math.abs(sb.a))/.5),hue=205+m*65;
  const lvl=h*.1;
  const o2=body(g,sa,t,tw,h,lvl,`hsla(${hue},90%,60%,.95)`,`hsla(${hue},85%,42%,.97)`);
  const off=sb.a*tw*.9,hw=tw*.18,bx=y=>off-(y/h)*tw*.12;
  g.save();g.beginPath();
  g.moveTo(bx(-h-40)-hw,-h-40);g.lineTo(bx(-h-40)+hw,-h-40);g.lineTo(bx(h+40)+hw,h+40);g.lineTo(bx(h+40)-hw,h+40);g.closePath();
  g.clip();
  body(g,sa,t,tw,h,lvl,`hsla(${hue},95%,74%,.95)`,`hsla(${hue},90%,58%,.97)`);
  g.restore();g.restore();
  const o1=Math.abs(sb.a)>.75,over=o1||o2;
  path();g.lineWidth=6;g.strokeStyle=over?'#ff5a5a':'rgba(90,240,230,.9)';g.shadowColor=over?'#ff5a5a':'#5af0e6';g.shadowBlur=14;g.stroke();
  g.shadowBlur=0;g.beginPath();g.moveTo(-tw-6,-h);g.lineTo(tw+6,-h);g.stroke();
  g.restore();
  return over;
}
function frame(t){
  const dt=Math.min((t-t0)/1000||.016,.05);t0=t;
  const lr=(have?ax-offx:fakeX)*($('i1').checked?-1:1);
  const raw=have?($('m').value==='z'?az-offz:ay-offy):fakeL;
  const fb=-raw*($('i2').checked?-1:1);
  step(A,lr*sens*.07,dt);
  step(B,fb*sens*.07,dt);
  const over=draw(g1,c1,B,A,t,190,140,240);
  const cur=Math.max(Math.abs(A.a),Math.abs(B.a));
  if(running){
    mx=Math.max(mx,cur);
    $('time').textContent=fmt((t-ts)/1000);
    $('cur').textContent=cur.toFixed(2);$('mx').textContent=mx.toFixed(2);
    if(over)finish(true);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
